name: Compilar APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # La llave de firma vive en los secretos del repositorio (Settings > Secrets and variables > Actions).
      - name: Preparar la llave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/manhwa.keystore"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/manhwa.keystore" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
            echo "Firmando con la llave de los secretos"
            echo "::notice::Llave de los secretos: $(keytool -list -keystore "$RUNNER_TEMP/manhwa.keystore" -storepass "${{ secrets.KEYSTORE_PASSWORD }}" 2>&1 | grep -iE 'SHA|fingerprint|error|invalid' | head -2 | tr '\n' ' ')"
          else
            echo "No hay secretos de firma: se usa la llave del repositorio"
            echo "::warning::NO se encontraron los secretos de firma"
          fi

      - name: Pruebas automáticas
        run: |
          set +e
          gradle testDebugUnitTest --no-daemon > test.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -E -A4 "^e: |FAILED" test.log | grep -v "^--" | head -30 | while read -r l; do echo "::error::${l:0:400}"; done
          fi
          exit $code

      - name: Compilar
        run: gradle assembleRelease --no-daemon

      - name: Guardar el APK
        uses: actions/upload-artifact@v4
        with:
          name: ManhwaTracker-apk
          path: app/build/outputs/apk/release/app-release.apk

      # Publica el APK como release: siempre queda uno con enlace fijo a la última versión.
      - name: Publicar release
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/release/app-release.apk ManhwaTracker.apk
          # Las notas de la versión salen de app/src/main/assets/changelog.md (el mismo archivo que usa la app).
          awk -v v="$VERSION" '/^## /{p=($2==v); next} p' app/src/main/assets/changelog.md > notes.md
          if [ ! -s notes.md ]; then
            echo "APK de Manhwa Tracker versión $VERSION. Se instala encima de la anterior." > notes.md
          fi
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            # Rama de prueba: pre-lanzamiento con etiqueta propia. No es "latest", así que no avisa de actualización a nadie.
            TAG="prueba-$GITHUB_REF_NAME"
            { echo "PRUEBA de la rama $GITHUB_REF_NAME (versión $VERSION). No es la versión oficial."; echo; cat notes.md; } > notes2.md
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" ManhwaTracker.apk --clobber
              gh release edit "$TAG" --notes-file notes2.md --prerelease --latest=false
            else
              gh release create "$TAG" ManhwaTracker.apk --title "Prueba: $GITHUB_REF_NAME" \
                --notes-file notes2.md --target "$GITHUB_SHA" --prerelease --latest=false
            fi
            exit 0
          fi
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" ManhwaTracker.apk --clobber
            gh release edit "v$VERSION" --notes-file notes.md
          else
            gh release create "v$VERSION" ManhwaTracker.apk --title "Versión $VERSION" \
              --notes-file notes.md --target "$GITHUB_SHA" --latest
          fi
